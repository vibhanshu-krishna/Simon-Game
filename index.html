<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 style="text-align: center;">Simon Game</h1>
    <div class="div">
        <div class="container">
            <button id="redSq" class="Square" ></button>
            <button id="greenSq" class="Square" ></button>
            <button id="blueSq" class="Square" ></button>
            <button id="yellowSq" class="Square" ></button>
        </div>
    </div>
    <div style="text-align: center;">
        <button id="start">Start</button>
        <button id="reset">Reset</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
